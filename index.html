index.html (UPDATED)
FIXED: loader + theme flash + persistent dark mode
========================= -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERINAÉ — Luxury Jewelry House</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- FIX: prevent white flash BEFORE paint -->
<script>
(function () {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
    }
})();
</script>

<style>

/* =========================
ROOT
========================= */

:root{
    --bg:#dfe7ed;
    --card:rgba(255,255,255,0.28);
    --text:#c7ac7c;
    --border:rgba(199,172,124,0.15);
    --glass:rgba(255,255,255,0.18);
    --heroGlow:rgba(199,172,124,0.12);
}

.dark-mode{
    --bg:#0f1114;
    --card:rgba(255,255,255,0.03);
    --text:#d6bc8d;
    --border:rgba(214,188,141,0.12);
    --glass:rgba(255,255,255,0.05);
    --heroGlow:rgba(214,188,141,0.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    transition:0.4s;
    position:relative;
}

/* =========================
LOADER
========================= */

.loader{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:999999;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:1s ease;
}

.loader.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-content{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.loader-logo{
    width:140px;
    margin-bottom:30px;
    animation:floatLogo 4s ease-in-out infinite;
}

.loader-title{
    font-family:'Cormorant Garamond', serif;
    font-size:5rem;
    letter-spacing:10px;
    margin-bottom:20px;
}

.loader-line{
    width:240px;
    height:2px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    position:relative;
}

.loader-line::after{
    content:'';
    position:absolute;
    width:40%;
    height:100%;
    background:var(--text);
    animation:loadingBar 2.5s ease infinite;
}

.loader-text{
    margin-top:25px;
    font-size:0.75rem;
    letter-spacing:4px;
    opacity:0.7;
}

#loader-theme-toggle{
    margin-top:30px;
    padding:12px 24px;
    border:1px solid var(--border);
    background:var(--glass);
    color:var(--text);
    cursor:pointer;
}

/* =========================
NAVBAR
========================= */

nav{
    position:fixed;
    width:100%;
    top:0;
    z-index:999;
    padding:24px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.08);
    border-bottom:1px solid var(--border);
}

.logo{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    letter-spacing:5px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:30px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:var(--text);
    letter-spacing:2px;
    font-size:0.72rem;
}

#theme-toggle{
    padding:12px 20px;
    border:1px solid var(--border);
    background:var(--glass);
    color:var(--text);
    cursor:pointer;
}

/* =========================
HERO
========================= */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:180px 20px 100px;
}

.hero h1{
    font-family:'Cormorant Garamond', serif;
    font-size:7rem;
}

/* =========================
SECTION (trimmed)
========================= */

.section{
    padding:120px 7%;
}

/* =========================
ANIMATIONS
========================= */

@keyframes floatLogo{
    0%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
    100%{transform:translateY(0);}
}

@keyframes loadingBar{
    0%{left:-40%;}
    100%{left:100%;}
}

</style>
</head>

<body>

<!-- LOADER -->
<div class="loader" id="loader">
    <div class="loader-content">

        <img src="logo.png" class="loader-logo" alt="logo">

        <div class="loader-title">ZERINAÉ</div>

        <div class="loader-line"></div>

        <div class="loader-text">ENTERING THE MAISON</div>

        <button id="loader-theme-toggle">DARK MODE</button>

    </div>
</div>

<!-- NAV -->
<nav>
    <div class="logo">ZERINAÉ</div>

    <div class="nav-right">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="products.html">PRODUCTS</a></li>
            <li><a href="prices.html">PRICES</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>

        <button id="theme-toggle">DARK MODE</button>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>ZERINAÉ</h1>
</section>

<script>

/* =========================
LOADER (FIXED - once per tab)
========================= */

const loader = document.getElementById('loader');

window.addEventListener('load', () => {

    const hasLoaded = sessionStorage.getItem('hasLoaded');

    if (hasLoaded) {
        loader.style.display = 'none';
        return;
    }

    setTimeout(() => {
        loader.classList.add('hidden');
        sessionStorage.setItem('hasLoaded', 'true');
    }, 4000);
});


/* =========================
THEME (NO FLASH FIX)
========================= */

const toggleButton = document.getElementById('theme-toggle');
const loaderThemeButton = document.getElementById('loader-theme-toggle');

function applyThemeUI() {
    const isDark = document.documentElement.classList.contains('dark-mode');

    toggleButton.innerText = isDark ? 'LIGHT MODE' : 'DARK MODE';
    loaderThemeButton.innerText = isDark ? 'LIGHT MODE' : 'DARK MODE';
}

function toggleTheme() {
    document.documentElement.classList.toggle('dark-mode');

    if (document.documentElement.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
    } else {
        localStorage.setItem('theme', 'light');
    }

    applyThemeUI();
}

applyThemeUI();

toggleButton.addEventListener('click', toggleTheme);
loaderThemeButton.addEventListener('click', toggleTheme);

</script>

</body>
</html>
