<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERINAÉ — Price List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#dfe7ed;
    --card:rgba(255,255,255,0.28);
    --text:#c7ac7c;
    --border:rgba(199,172,124,0.15);
    --glass:rgba(255,255,255,0.18);
}

body.dark-mode{
    --bg:#0f1114;
    --card:rgba(255,255,255,0.03);
    --text:#d6bc8d;
    --border:rgba(214,188,141,0.12);
    --glass:rgba(255,255,255,0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    transition:0.4s;
}

nav{
    position:fixed;
    width:100%;
    top:0;
    z-index:999;
    padding:24px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.08);
    border-bottom:1px solid var(--border);
}

.logo{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    letter-spacing:5px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:30px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:var(--text);
    letter-spacing:2px;
    font-size:0.72rem;
}

#theme-toggle{
    padding:12px 20px;
    border:1px solid var(--border);
    background:var(--glass);
    color:var(--text);
    cursor:pointer;
}

.section{
    padding:180px 7% 120px;
}

.section-title{
    text-align:center;
    margin-bottom:70px;
}

.section-title h2{
    font-family:'Cormorant Garamond', serif;
    font-size:4rem;
    margin-bottom:15px;
}

.price-list{
    display:grid;
    gap:25px;
}

.price-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:35px;
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    transition:0.4s;
}

.price-row:hover{
    transform:translateX(8px);
}

.price-row h3{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
}

footer{
    padding:50px 7%;
    border-top:1px solid var(--border);
    text-align:center;
}

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:18px;
        padding:18px 5%;
    }

    .nav-right{
        flex-direction:column;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    .section{
        padding:220px 5% 100px;
    }

    .price-row{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }

}

</style>

</head>

<body>

<nav>

<div class="logo">
ZERINAÉ
</div>

<div class="nav-right">

<ul>
<li><a href="index.html">HOME</a></li>
<li><a href="products.html">PRODUCTS</a></li>
<li><a href="prices.html">PRICES</a></li>
<li><a href="contact.html">CONTACT</a></li>
</ul>

<button id="theme-toggle">
DARK MODE
</button>

</div>

</nav>

<section class="section">

<div class="section-title">

<h2>
Price List
</h2>

<p>
ESTIMATED LUXURY PRICING
</p>

</div>

<div class="price-list">

<div class="price-row">
<h3>Luxury Rings</h3>
<p>$1,500 — $8,000</p>
</div>

<div class="price-row">
<h3>Diamond Necklaces</h3>
<p>$3,000 — $18,000</p>
</div>

<div class="price-row">
<h3>Bracelets</h3>
<p>$950 — $6,500</p>
</div>

<div class="price-row">
<h3>Private Editions</h3>
<p>Custom Pricing</p>
</div>

</div>

</section>

<footer>
<p>© 2026 ZERINAÉ — All Rights Reserved</p>
</footer>

<script>

const toggleButton = document.getElementById('theme-toggle');

if(localStorage.getItem('theme') === 'dark'){

    document.body.classList.add('dark-mode');
    toggleButton.innerText = 'LIGHT MODE';

}

toggleButton.addEventListener('click', () => {

    document.body.classList.toggle('dark-mode');

    if(document.body.classList.contains('dark-mode')){

        localStorage.setItem('theme', 'dark');
        toggleButton.innerText = 'LIGHT MODE';

    } else {

        localStorage.setItem('theme', 'light');
        toggleButton.innerText = 'DARK MODE';

    }

});

</script>

</body>
</html>
